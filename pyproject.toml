[project]
name = "leal-transcription"
version = "0.1.0"
description = "Fast local audio transcription CLI backed by faster-whisper + CUDA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Swellshinider", email = "eduardoleal.contact@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "pyperclip",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.urls]
Homepage = "https://github.com/Swellshinider/LealTranscription"
Repository = "https://github.com/Swellshinider/LealTranscription"
Issues = "https://github.com/Swellshinider/LealTranscription/issues"

[project.scripts]
lt = "leal_transcription.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
